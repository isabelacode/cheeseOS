<template>
  <style>
    #root { position: absolute; inset: 0; }
    /* Ink type straight on the brightened wall: no box. */
    #hook-box { position: absolute; left: 1180px; top: 300px; width: 548px; }
    #hook-route { font-family: var(--font-mono); font-size: 28px; letter-spacing: 0.14em; color: var(--ink-2); display: flex; align-items: center; gap: 16px; }
    #hook-track { position: relative; width: 190px; height: 12px; }
    #hook-line { position: absolute; left: 0; top: 5px; width: 190px; height: 2px; background: linear-gradient(90deg, #d9552b, var(--accent)); transform-origin: left; }
    #hook-dot { position: absolute; left: -6px; top: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); opacity: 0; }
    #hook-num { font-size: 230px; font-weight: 300; letter-spacing: -0.06em; line-height: 0.95; margin-top: 26px; font-variant-numeric: tabular-nums; color: var(--ink); }
    #hook-num small { font-size: 64px; font-weight: 400; color: var(--ink-2); margin-left: 12px; letter-spacing: -0.02em; }
    #hook-sub { font-size: 40px; font-weight: 400; line-height: 1.2; margin-top: 18px; color: var(--ink); }
    #hook-sub b { color: var(--crit); font-weight: 600; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <div id="hook-box" class="clip" data-start="0.2" data-duration="3.6">
      <div id="hook-route"><span>MARS</span><div id="hook-track"><div id="hook-line"></div><div id="hook-dot"></div></div><span>EARTH</span></div>
      <div id="hook-num"><span id="hook-count">0</span><small>min</small></div>
      <div id="hook-sub">for help to arrive.<br /><b>No doctor on call.</b></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#hook-route", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.3);
    tl.fromTo("#hook-line", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, 0.35);
    // The signal crawls from Mars to Earth while the delay counts up.
    tl.fromTo("#hook-dot", { opacity: 0, x: 0 }, { opacity: 1, x: 190, duration: 1.2, ease: "power1.inOut" }, 0.4);
    tl.to("#hook-dot", { opacity: 0, scale: 2.2, duration: 0.3, ease: "power2.out" }, 1.6);
    tl.fromTo("#hook-num", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
    const n = { v: 0 };
    tl.fromTo(n, { v: 0 }, { v: 20, duration: 1.1, ease: "power2.out", onUpdate: () => {
      document.getElementById("hook-count").textContent = Math.round(n.v);
    } }, 0.45);
    tl.fromTo("#hook-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.9);
    tl.to("#hook-box", { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" }, 3.4);
    window.__timelines["hook"] = tl;
  </script>
</template>
