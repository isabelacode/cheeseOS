    const inStep = (sel, at) => tl.fromTo(sel, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.08 }, at);

    inStep("#how-s1 > *", 0.1);
    const bars = gsap.utils.toArray("#how-s1 .how-bar");

      bars.forEach((b, i) => {
        const env = Math.min(1, w.t * 3) * Math.max(0, 1 - Math.max(0, w.t - 1.6) * 2.5);
