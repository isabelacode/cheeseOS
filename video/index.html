<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <style>
      /* Two worlds: the presenter on a bright wall (ink type, glass cards) and the product
         in deep space (the dark layer that opens over the camera and closes back). */
      :root {
        --paper: #f6f5f1;
        --ink: #0e1320;
        --ink-2: #4b5468;
        --space: #070b18;
        --on-space: #f4f6fb;
        --on-space-2: #a3acbe;
        --accent: #2f6bff;
        --cheese: #ffc93c;
        --crit: #e5383b;
        --font-display: "Outfit", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
        /* Graphics column, inside the 80% title-safe box. */
        --col-x: 1180px;
        --col-w: 548px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }

      /* ---------- Camera: full frame, punched in on the cuts ---------- */
      #cam {
        position: absolute;
        inset: 0;
        z-index: 0;
        transform-origin: 28% 34%;
      }
      #presenter-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Brightens the free side so ink type reads over any wall. */
      #wash {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #wash-fill {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(246, 245, 241, 0) 53%, rgba(246, 245, 241, 0.8) 63%, rgba(246, 245, 241, 0.94) 100%);
        opacity: 0;
      }

      /* ---------- The dark layer: a card window that opens to full screen ---------- */
      #space {
        position: absolute;
        inset: 0;
        z-index: 3;
      }
      #space-clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: radial-gradient(ellipse 70% 80% at 35% 50%, #12224f 0%, #0a1126 55%, var(--space) 100%);
        opacity: 0;
      }
      #twin-canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 548px;
        height: 470px;
        display: block;
        transform-origin: 0 0;
      }
      /* Red wash behind the chest as it goes critical (card window only). */
      #twin-alert {
        position: absolute;
        left: var(--col-x);
        top: 110px;
        width: var(--col-w);
        height: 400px;
        background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(255, 75, 75, 0.5) 0%, rgba(255, 75, 75, 0) 72%);
        opacity: 0;
      }

      .scene-host {
        position: absolute;
        inset: 0;
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="29" data-width="1920" data-height="1080">
      <!-- The recording: 29 s landscape, you on the LEFT third, bright wall. Replace assets/me.mp4 to swap takes. -->
      <div id="cam">
        <video id="presenter-video" class="clip" src="assets/me.mp4" data-start="0" data-duration="28.6" data-track-index="0" data-has-audio="true" data-layout-allow-overlap=""></video>
      </div>
      <div id="wash" class="clip" data-start="0" data-duration="29" data-track-index="1" data-layout-allow-overlap=""><div id="wash-fill"></div></div>

      <!-- Product layer: clipped to a card beside the presenter, or opened to the whole frame. -->
      <div id="space" class="clip" data-start="0" data-duration="29" data-track-index="2" data-track-kind="graphics" data-layout-allow-overlap="">
        <div id="space-clip">
          <canvas id="twin-canvas" width="1096" height="940"></canvas>
          <div id="twin-alert"></div>
        </div>
      </div>

      <div id="intro" class="scene-host" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="3" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="hook" class="scene-host" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="2.4" data-duration="3.8" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="title" class="scene-host" data-composition-id="title" data-composition-src="compositions/title.html" data-start="6.2" data-duration="3.6" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="how" class="scene-host" data-composition-id="how" data-composition-src="compositions/how.html" data-start="9.8" data-duration="9.6" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="daily" class="scene-host" data-composition-id="daily" data-composition-src="compositions/daily.html" data-start="19.4" data-duration="3.2" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="future" class="scene-host" data-composition-id="future" data-composition-src="compositions/future.html" data-start="22.6" data-duration="6.4" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="captions" class="scene-host" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="29" data-track-index="6" data-track-kind="captions" data-width="1920" data-height="1080"></div>

      <!-- Music bed: kept low so it sits under the presenter's voice. -->
      <audio id="bgm" class="clip" src=".media/audio/bgm/bgm_001.mp3" data-start="0" data-duration="29" data-media-start="0.8" data-volume="0.083176" data-fade-in="0.6" data-fade-out="2.2" data-track-index="10"></audio>
      <!-- Effects, each on a visible action. -->
      <audio id="sfx-count-pop" class="clip" src=".media/audio/sfx/sfx_002.mp3" data-start="3.9" data-duration="0.48" data-volume="0.9" data-track-index="12"></audio>
      <audio id="sfx-open-title" class="clip" src=".media/audio/sfx/sfx_001.mp3" data-start="5.75" data-duration="2.2" data-volume="0.34" data-fade-out="0.4" data-track-index="11"></audio>
      <audio id="sfx-heartbeat" class="clip" src=".media/audio/sfx/sfx_003.mp3" data-start="12.65" data-duration="1.4" data-media-start="0.4" data-volume="0.7" data-fade-in="0.05" data-fade-out="0.5" data-track-index="13"></audio>
      <audio id="sfx-chip-pop" class="clip" src=".media/audio/sfx/sfx_002.mp3" data-start="12.75" data-duration="0.48" data-volume="0.9" data-track-index="12"></audio>
      <audio id="sfx-open-train" class="clip" src=".media/audio/sfx/sfx_001.mp3" data-start="19.0" data-duration="2.2" data-volume="0.34" data-fade-out="0.4" data-track-index="11"></audio>
      <audio id="sfx-rep-1" class="clip" src=".media/audio/sfx/sfx_002.mp3" data-start="20.72" data-duration="0.48" data-volume="0.9" data-track-index="12"></audio>
      <audio id="sfx-rep-2" class="clip" src=".media/audio/sfx/sfx_002.mp3" data-start="22.17" data-duration="0.48" data-volume="0.9" data-track-index="12"></audio>
      <audio id="sfx-open-end" class="clip" src=".media/audio/sfx/sfx_001.mp3" data-start="25.45" data-duration="2.2" data-volume="0.3" data-fade-out="0.4" data-track-index="11"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // The dark layer's window, as clip-path insets (top right bottom left) on the 1920x1080 frame.
      const FULL = "inset(0px 0px 0px 0px round 0px)";
      const CARD = "inset(110px 192px 570px 1180px round 28px)";
      const SEED = "inset(310px 466px 770px 1454px round 28px)"; // zero-size, centre of the card
      const MID = "inset(540px 960px 540px 960px round 28px)"; // zero-size, centre of the frame
      // The twin canvas inside it: small in the card, large and left of centre when open.
      const IN_CARD = { x: 1180, y: 75, scale: 1 };
      const OPEN = { x: 150, y: 94, scale: 1.9 };

      // 0:02.4 first cut: punch in, and the free side brightens for the type.
      tl.set("#cam", { scale: 1.14 }, 2.4);
      tl.fromTo("#wash-fill", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.4);

      // 0:06 "This is cheeseOS": the product opens over the camera.
      gsap.set("#twin-canvas", OPEN);
      tl.fromTo("#space-clip", { clipPath: SEED, opacity: 0 }, { clipPath: FULL, opacity: 1, duration: 0.75, ease: "power3.inOut" }, 5.9);
      // 0:09.5 back to camera: the product folds into a card beside the presenter.
      tl.set("#cam", { scale: 1 }, 9.4);
      tl.fromTo("#space-clip", { clipPath: FULL }, { clipPath: CARD, duration: 0.75, ease: "power3.inOut", immediateRender: false }, 9.45);
      tl.fromTo("#twin-canvas", OPEN, { ...IN_CARD, duration: 0.75, ease: "power3.inOut", immediateRender: false }, 9.45);

      // 0:12.8 "Your twin shows where": a red wash pulses behind the chest (camera push-in: K below).
      tl.fromTo("#twin-alert", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, 12.8);
      tl.to("#twin-alert", { opacity: 0.3, duration: 0.35, ease: "sine.inOut" }, 12.95);
      tl.to("#twin-alert", { opacity: 0.85, duration: 0.25, ease: "sine.inOut" }, 13.3);
      tl.to("#twin-alert", { opacity: 0, duration: 0.5, ease: "sine.in" }, 13.55);
      // Cut in for the last two steps.
      tl.set("#cam", { scale: 1.12 }, 14.6);

      // 0:19.2 "It counts exercise and sleep": the card opens again for the trainer.
      tl.fromTo("#space-clip", { clipPath: CARD }, { clipPath: FULL, duration: 0.7, ease: "power3.inOut", immediateRender: false }, 19.15);
      tl.fromTo("#twin-canvas", IN_CARD, { ...OPEN, duration: 0.7, ease: "power3.inOut", immediateRender: false }, 19.15);
      // 0:22.4 back to camera, wide.
      tl.set("#cam", { scale: 1 }, 22.3);
      tl.fromTo("#space-clip", { clipPath: FULL }, { clipPath: SEED, duration: 0.55, ease: "power3.inOut", immediateRender: false }, 22.35);
      tl.to("#space-clip", { opacity: 0, duration: 0.2, ease: "power2.in" }, 22.65);
      tl.to("#twin-canvas", { opacity: 0, duration: 0.3, ease: "power2.in" }, 22.35);

      // 0:25.7 end lockup: the dark layer opens from the middle and stays.
      tl.fromTo("#space-clip", { clipPath: MID, opacity: 1 }, { clipPath: FULL, opacity: 1, duration: 0.7, ease: "power3.inOut", immediateRender: false }, 25.65);
      window.__timelines["main"] = tl;
    </script>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const W = 1096, H = 940;
      const canvas = document.getElementById("twin-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);

      scene.add(new THREE.HemisphereLight(0x9fb6ff, 0x0a0d18, 0.9));
      const key = new THREE.DirectionalLight(0xfff1dc, 2.4);
      key.position.set(2.5, 3, 3.5);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x3d7bff, 3.2);
      rim.position.set(-3, 2.2, -3);
      scene.add(rim);
      const rim2 = new THREE.DirectionalLight(0x6fa0ff, 1.6);
      rim2.position.set(3, 1.5, -2.5);
      scene.add(rim2);

      function hash(n) {
        const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return s - Math.floor(s);
      }
      const STARS = 500;
      const starPos = new Float32Array(STARS * 3);
      for (let i = 0; i < STARS; i++) {
        starPos[i * 3] = (hash(i) - 0.5) * 30;
        starPos[i * 3 + 1] = (hash(i + 1000) - 0.5) * 24;
        starPos[i * 3 + 2] = -6 - hash(i + 2000) * 30;
      }
      const starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
      const stars = new THREE.Points(
        starGeo,
        new THREE.PointsMaterial({ color: 0xcfd8ff, size: 0.06, sizeAttenuation: true, transparent: true, opacity: 0.7 }),
      );
      scene.add(stars);

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.42, 0.45, 96),
        new THREE.MeshBasicMaterial({ color: 0x3d7bff, transparent: true, opacity: 0.7, side: THREE.DoubleSide }),
      );
      ring.rotation.x = -Math.PI / 2;
      const disc = new THREE.Mesh(
        new THREE.CircleGeometry(0.42, 96),
        new THREE.MeshBasicMaterial({ color: 0x3d7bff, transparent: true, opacity: 0.08, side: THREE.DoubleSide }),
      );
      disc.rotation.x = -Math.PI / 2;

      // Heat-zone shader from the app (src/components/twin/CrewModel.tsx).
      const N = 7;
      const TORSO = 1;
      const centers = [
        [0, 1.585, 0.0], [0, 1.3, 0.02], [0, 1.02, 0.02], [0.29, 1.08, -0.01],
        [-0.29, 1.08, -0.01], [0.1, 0.55, 0.01], [-0.1, 0.55, 0.01],
      ];
      const radii = [
        [0.13, 0.15, 0.14], [0.21, 0.17, 0.17], [0.19, 0.13, 0.16], [0.13, 0.32, 0.11],
        [0.13, 0.32, 0.11], [0.12, 0.42, 0.12], [0.12, 0.42, 0.12],
      ];
      const uniforms = {
        uSeverity: { value: new Float32Array(N) },
        uTime: { value: 0 },
        uScan: { value: -1 },
        uTint: { value: [new THREE.Color("#e3e6eb"), new THREE.Color("#e8b54a"), new THREE.Color("#e07b2e"), new THREE.Color("#ff3b3b")] },
        uCenter: { value: centers.map((c) => new THREE.Vector3(...c)) },
        uRadius: { value: radii.map((r) => new THREE.Vector3(...r)) },
      };
      const material = new THREE.MeshStandardMaterial({ color: 0xe3e6eb, roughness: 0.45, metalness: 0.02 });
      material.onBeforeCompile = (shader) => {
        Object.assign(shader.uniforms, uniforms);
        shader.vertexShader = shader.vertexShader
          .replace("#include <common>", "#include <common>\nvarying vec3 vBind;")
          .replace("#include <begin_vertex>", "#include <begin_vertex>\nvBind = position;");
        shader.fragmentShader = shader.fragmentShader
          .replace(
            "#include <common>",
            `#include <common>
varying vec3 vBind;
uniform float uSeverity[${N}];
uniform vec3 uCenter[${N}];
uniform vec3 uRadius[${N}];
uniform float uTime;
uniform float uScan;
uniform vec3 uTint[4];`,
          )
          .replace(
            "#include <color_fragment>",
            `#include <color_fragment>
vec3 heatColor = vec3(0.0);
float heat = 0.0;
for (int i = 0; i < ${N}; i++) {
  float d = length((vBind - uCenter[i]) / uRadius[i]);
  float w = 1.0 - smoothstep(0.5, 1.2, d);
  float sev = uSeverity[i];
  if (sev > 0.01) {
    float lv = clamp(sev, 1.0, 3.0);
    vec3 tint = lv < 2.0 ? mix(uTint[1], uTint[2], lv - 1.0) : mix(uTint[2], uTint[3], lv - 2.0);
    float pulse = 0.85 + 0.15 * sin(uTime * (1.5 + sev) * 2.0);
    float a = w * clamp(0.55 + 0.2 * (sev - 1.0), 0.0, 1.0) * min(sev, 1.0) * pulse;
    if (a > heat) { heat = a; heatColor = tint; }
  }
}
diffuseColor.rgb = mix(diffuseColor.rgb, heatColor, min(1.0, heat * 1.1));
float scan = (1.0 - smoothstep(0.0, 0.025, abs(vBind.y - uScan))) * step(0.0, uScan);
vec3 extraGlow = heatColor * heat * 0.35 + vec3(0.24, 0.48, 1.0) * scan * 1.6;`,
          )
          .replace("#include <emissivemap_fragment>", "#include <emissivemap_fragment>\ntotalEmissiveRadiance += extraGlow;");
      };

      const body = new THREE.Group();
      body.add(ring, disc);
      scene.add(body);
      let mixer = null;
      let idle = null;
      let squat = null;
      // The clip loops every 3.2 s; at 2.2x a repetition lands every 1.45 s (rep counter: compositions/daily.html).
      const SQUAT_AT = 19.4;
      const SQUAT_SPEED = 2.2;

      // Camera keyframes inside the card: z/y = camera, ly = look-at height, r = body yaw.
      const K = [
        // Title takeover: slow turn while the scan line runs.
        { t: 0.0, z: 4.2, y: 0.95, ly: 0.9, x: 0, r: 0.6 },
        { t: 6.0, z: 4.2, y: 0.95, ly: 0.9, x: 0, r: 0.6 },
        { t: 9.8, z: 4.1, y: 0.95, ly: 0.9, x: 0, r: -0.05 },
        { t: 12.1, z: 4.1, y: 0.95, ly: 0.9, x: 0, r: -0.12 },
        // Push-in on head and chest while the zone lights up.
        { t: 12.8, z: 2.3, y: 1.4, ly: 1.36, x: 0, r: 0.1 },
        { t: 14.1, z: 2.2, y: 1.4, ly: 1.36, x: 0, r: 0.28 },
        { t: 14.7, z: 4.1, y: 0.95, ly: 0.9, x: 0, r: -0.1 },
        { t: 19.1, z: 4.1, y: 0.95, ly: 0.9, x: 0, r: 0.15 },
        // Trainer takeover: three-quarter view so the squat reads, as in the app's demo.
        { t: 19.8, z: 4.3, y: 0.95, ly: 0.82, x: 0, r: 0.73 },
        { t: 29.0, z: 4.3, y: 0.95, ly: 0.82, x: 0, r: 0.73 },
      ];
      const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
      function frame(t) {
        if (t <= K[0].t) return K[0];
        for (let i = 0; i < K.length - 1; i++) {
          const a = K[i], b = K[i + 1];
          if (t <= b.t) {
            const u = ease((t - a.t) / (b.t - a.t));
            const o = {};
            for (const k of ["z", "y", "ly", "x", "r"]) o[k] = a[k] + (b[k] - a[k]) * u;
            return o;
          }
        }
        return K[K.length - 1];
      }
      const clamp01 = (v) => Math.min(1, Math.max(0, v));

      function renderAt(t) {
        const f = frame(t);
        body.rotation.y = f.r;
        camera.position.set(f.x, f.y, f.z);
        camera.lookAt(f.x, f.ly, 0);
        stars.position.x = -t * 0.05;

        // Chest lights up as the symptom is mapped, cools after the section.
        const sev = 3 * clamp01((t - 12.55) / 0.7) * (1 - clamp01((t - 18.6) / 0.6));
        uniforms.uSeverity.value[TORSO] = sev;
        uniforms.uTime.value = t;
        let scan = -1;
        if (t > 6.7 && t < 8.5) scan = ((t - 6.7) / 1.8) * 1.8;
        else if (t > 14.8 && t < 16.3) scan = ((t - 14.8) / 1.5) * 1.8;
        uniforms.uScan.value = scan;

        if (mixer) {
          // Idle everywhere; the squat clip blends in for the trainer beat.
          const w = squat ? clamp01((t - SQUAT_AT) / 0.3) * (1 - clamp01((t - 22.6) / 0.3)) : 0;
          idle.time = t % 4;
          idle.setEffectiveWeight(1 - w);
          if (squat) {
            squat.time = (Math.max(0, t - SQUAT_AT) * SQUAT_SPEED) % squat.getClip().duration;
            squat.setEffectiveWeight(w);
          }
          mixer.update(0);
        }
        renderer.render(scene, camera);
      }

      async function build() {
        const gltf = await new GLTFLoader().loadAsync("assets/crew-body.glb");
        const model = gltf.scene;
        model.traverse((o) => {
          if (!o.isMesh) return;
          o.material = material;
          o.frustumCulled = false;
        });
        body.add(model);
        // Keyframes only, built on this same rig (the app's /twin/crew-exercises.glb).
        const clips = await new GLTFLoader().loadAsync("assets/crew-exercises.glb");
        const idleClip = gltf.animations.find((a) => /idle/i.test(a.name)) || gltf.animations[0];
        const squatClip = clips.animations.find((a) => a.name === "squat");
        if (idleClip) {
          const m = new THREE.AnimationMixer(model);
          idle = m.clipAction(idleClip).play();
          if (squatClip) squat = m.clipAction(squatClip).play();
          mixer = m;
        }
        await renderer.compileAsync(scene, camera);
        renderAt(window.__hfThreeTime || 0);
      }

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["twin"] = build();

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
